# march — Hyprland, in the style of Omarchy (see NOTICE).
#
# Edit freely: this file is yours. It is copied from /etc/skel on first login
# and is never overwritten afterwards.

source = ~/.config/hypr/apps.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf

# Written by march: restores blur, shadows and animations when the guest has
# hardware rendering, and leaves them off when it does not.
source = ~/.config/hypr/effects.conf

# The monitor line is written by march at install time so the guest matches the
# window it opens in. "preferred" follows whatever resolution QEMU reports.
source = ~/.config/hypr/monitor.conf

# Autostart. Everything here is packaged for aarch64; Omarchy's own agents and
# theme daemons are deliberately absent.
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = swaybg -c "#1a1b26"
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Hand the environment to systemd and D-Bus, or portals and any service started
# later come up without WAYLAND_DISPLAY and fail in confusing ways.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
