# Launcher. Omarchy uses walker, which has no aarch64 package; fuzzel fills the
# same role and is styled here to match Omarchy's dark, square look.

[main]
font=JetBrainsMono Nerd Font:size=14
terminal=alacritty -e
layer=overlay
width=45
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8

[colors]
background=1a1b26f0
text=c0caf5ff
match=7dcfffff
selection=283457ff
selection-text=c0caf5ff
selection-match=7dcfffff
border=33ccffee

[border]
width=2
radius=0
