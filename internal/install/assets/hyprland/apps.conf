# Default applications, from Omarchy v3.8.4 (see NOTICE), pointed at what is
# packaged for Arch Linux ARM. Omarchy defaults to Ghostty, which has no aarch64
# package; Alacritty is the closest equivalent that does.

$terminal = alacritty
$browser = chromium --ozone-platform=wayland
$fileManager = nautilus --new-window

# Window rules use the syntax Hyprland 0.53+ expects: match conditions are
# written as match:<field>, and the effect carries an explicit value. The older
# "windowrule = float, class:^(x)$" form is rejected outright by 0.56, and
# "suppressevent"/"nofocus" were renamed to "suppress_event"/"no_focus".
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on

# Fix an XWayland quirk where a stray unnamed window steals focus.
windowrule = match:class ^$, match:title ^$, match:xwayland 1, no_focus on
