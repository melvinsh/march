# Video, on a guest that usually has no GPU.
#
# mpv's default output is gpu-next through an OpenGL context. Behind virtio-gpu
# without acceleration that context cannot be created — "egl: failed to create
# dri2 screen" — and mpv then falls back to X11 and aborts outright:
#
#   mpv: ../mpv/video/out/x11_common.c:679: vo_x11_init: Assertion `!vo->x11'
#
# So the fallback is named here instead. wlshm hands frames to the compositor
# through shared memory and needs no GL at all; on an accelerated guest the
# first entry wins and nothing is given up.
vo=gpu,wlshm
gpu-context=wayland

# virtio-gpu exposes no video decoder, and asking for one only produces
# vaInitialize failures on every file.
hwdec=no
