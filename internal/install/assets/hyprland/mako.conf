# Notifications, styled to match. Omarchy themes this per-theme; march ships one.
font=JetBrainsMono Nerd Font 11
background-color=#1a1b26f0
text-color=#c0caf5
border-color=#33ccff
border-size=2
border-radius=0
padding=12
margin=10
default-timeout=5000
anchor=top-right

# The mode march-toggle switches on and off, standing in for Omarchy's
# notification silencing. Without a mode to switch to, the toggle has nothing
# to do.
[mode=do-not-disturb]
invisible=1
