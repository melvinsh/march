# Lock screen, styled to match the rest (see NOTICE).
#
# hyprlock refuses to start without a config — "Could not find config. Searched
# in order: XDG_CONFIG_HOME, HOME, XDG_CONFIG_DIRS, /etc/xdg" — so shipping one
# is what makes SUPER + CTRL + L and the menu's Lock do anything at all.
#
# This file is still hyprlang: hyprlock has its own parser and has not followed
# Hyprland to Lua.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = rgba(33ccffee)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(7dcfffee)
    fail_color = rgba(f7768eee)
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 56
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(565f89ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
